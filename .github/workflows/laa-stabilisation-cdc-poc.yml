---
name: laa-stabilisation-cdc-poc
on:
  push:
    branches:
      - main
    paths:
      - 'terraform/environments/laa-stabilisation-cdc-poc/**'
      - '.github/workflows/laa-stabilisation-cdc-poc.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'terraform/environments/laa-stabilisation-cdc-poc/**'
      - '.github/workflows/laa-stabilisation-cdc-poc.yml'

  workflow_dispatch:
    inputs:
      action:
        description: 'Set either [deploy|destroy].'
        default: 'deploy'
        required: true
        type: string
        options:
          - deploy
          - destroy

permissions:
  id-token: write  # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

jobs:
  strategy:
    uses: ./.github/workflows/reusable_terraform_components_strategy.yml
    if: inputs.action != 'destroy'
    with:
      application: "${{ github.workflow }}"

  terraform:
    needs: strategy
    if: inputs.action != 'destroy' && join(fromJson(needs.strategy.outputs.matrix).include) != ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.strategy.outputs.matrix) }}
    uses: ./.github/workflows/reusable_terraform_components_plan_apply.yml
    with:
      application: "${{ github.workflow }}"
      environment: "${{ matrix.target }}"
      action: "${{ matrix.action }}"
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_ID: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}

  destroy-development:
    if: inputs.action == 'destroy'
    uses: ./.github/workflows/reusable_terraform_components_plan_apply.yml
    with:
      application: "${{ github.workflow }}"
      environment: "development"
      action: "plan_apply"
      plan_apply_tfargs: "-destroy"
      state_rm_addresses: >-
        module.cwa-poc2-environment.aws_lb.internal
        module.cwa-poc2-environment.aws_lb_listener.internal
        module.cwa-poc2-environment.aws_security_group.internal_lb
        module.cwa-poc2-environment.aws_vpc_security_group_ingress_rule.internal_lb_inbound
        module.cwa-poc2-environment.aws_vpc_security_group_egress_rule.internal_lb_outbound
        aws_security_group.backup_lambda
        aws_lambda_permission.allow_cloudwatch_to_call_check_mon_fri
        aws_cloudwatch_event_target.deletesnapshotFunctioncheck_mon_fri
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_ID: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}
