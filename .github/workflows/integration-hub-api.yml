---
name: integration-hub-api
on:
  push:
    branches:
      - main
    paths:
      - 'terraform/environments/integration-hub-api/**'
      - '.github/workflows/integration-hub-api.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'terraform/environments/integration-hub-api/**'
      - '.github/workflows/integration-hub-api.yml'

  workflow_dispatch:
    inputs:
      test_upload_recovery:
        description: 'Development only: restore upload policies, then deploy file-transfer-api for testing.'
        required: false
        default: false
        type: boolean
      action:
        description: 'Set either [deploy|destroy].'
        default: 'deploy'
        required: true
        type: string
        options:
          - deploy
          - destroy
      component:
        description: "Optional: Target a specific component for destroy. Defaults to 'root' to destroy the root or <application> folder."
        required: false
        default: "root"
        type: string

permissions:
  id-token: write  # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

jobs:
  strategy:
    uses: ./.github/workflows/reusable_terraform_components_strategy.yml
    if: inputs.action != 'destroy' && inputs.test_upload_recovery != true
    with:
      application: "${{ github.workflow }}"

  terraform:
    needs: strategy
    if: inputs.action != 'destroy' && inputs.test_upload_recovery != true && join(fromJson(needs.strategy.outputs.matrix).include) != ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.strategy.outputs.matrix) }}
    uses: ./.github/workflows/reusable_terraform_components_plan_apply.yml
    with:
      application: "${{ github.workflow }}"
      account_name: "integration-hub-api-${{ matrix.target }}"
      environment: "${{ matrix.target }}"
      action: "${{ matrix.action }}"
      component: "${{ matrix.component }}"     # If your strategy workflow also outputs "matrix.component"
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_ID: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}

  restore-development-upload-policies:
    if: github.event_name == 'workflow_dispatch' && inputs.test_upload_recovery == true && inputs.action == 'deploy'
    uses: ./.github/workflows/reusable_terraform_components_plan_apply.yml
    with:
      application: integration-hub-file-transfer
      account_name: integration-hub-file-transfer-development
      environment: development
      component: root
      action: plan_apply
      # Exceptional recovery only: preserve other branches' dispatcher deployments.
      # Terraform includes dependencies; inspect the plan before approving apply.
      plan_apply_tfargs: >-
        -target=module.kms_s3_bucket[\"incoming\"].aws_kms_key.this[0]
        -target=module.s3_bucket[\"incoming\"].aws_s3_bucket_policy.this[0]
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_ID: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}

  deploy-development-upload-api:
    needs: restore-development-upload-policies
    if: github.event_name == 'workflow_dispatch' && inputs.test_upload_recovery == true && inputs.action == 'deploy'
    uses: ./.github/workflows/reusable_terraform_components_plan_apply.yml
    with:
      application: integration-hub-api
      account_name: integration-hub-api-development
      environment: development
      component: file-transfer-api
      action: plan_apply
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_ID: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}

  destroy-development:
    if: inputs.action == 'destroy'
    uses: ./.github/workflows/reusable_terraform_components_plan_apply.yml
    with:
      application: "${{ github.workflow }}"
      account_name: "integration-hub-api-development"
      environment: "development"
      action: "plan_apply"
      plan_apply_tfargs: "-destroy"
      component: "${{ inputs.component }}"  # Targets a specific component for the destroy operation; defaults to 'root' if not specified.
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_ID: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}
