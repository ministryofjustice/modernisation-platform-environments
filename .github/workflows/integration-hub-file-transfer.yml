---
name: integration-hub-file-transfer
on:
  push:
    branches:
      - main
    paths:
      - 'terraform/environments/integration-hub-file-transfer/**'
      - '.github/workflows/integration-hub-file-transfer.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'terraform/environments/integration-hub-file-transfer/**'
      - '.github/workflows/integration-hub-file-transfer.yml'

  workflow_dispatch:
    inputs:
      action:
        description: 'Set either [deploy|destroy].'
        default: 'deploy'
        required: true
        type: string
        options:
          - deploy
          - destroy
      component:
        description: "Optional: Target a specific component for destroy. Defaults to 'root' to destroy the root or <application> folder."
        required: false
        default: "root"
        type: string

permissions:
  id-token: write  # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

jobs:
  python-tests:
    if: inputs.action != 'destroy'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Run Unit Tests
        working-directory: terraform/environments/integration-hub-file-transfer
        run: |
          set -euo pipefail

          while IFS= read -r requirements; do
            if ! output=$(python -m pip install -r "$requirements" 2>&1); then
              printf '%s\n' "$output"
              exit 1
            fi
          done < <(find lambda -type f -name '*requirements.txt' | sort)

          for test_directory in lambda/*; do
            if find "$test_directory" -maxdepth 1 -type f -name 'test_*.py' -print -quit | grep -q .; then
              if output=$(python -m unittest discover -s "$test_directory" -p 'test_*.py' -v 2>&1); then
                summary=$(printf '%s\n' "$output" | sed -n '/^Ran /p')
                printf '%s: %s\n' "${test_directory#lambda/}" "$summary"
              else
                printf '%s\n' "$output"
                exit 1
              fi
            fi
          done

          printf '%s\n' 'All Lambda unit tests passed.'

  strategy:
    needs: python-tests
    uses: ./.github/workflows/reusable_terraform_components_strategy.yml
    if: inputs.action != 'destroy'
    with:
      application: "${{ github.workflow }}"

  terraform:
    needs: strategy
    if: inputs.action != 'destroy' && join(fromJson(needs.strategy.outputs.matrix).include) != ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.strategy.outputs.matrix) }}
    uses: ./.github/workflows/reusable_terraform_components_plan_apply.yml
    with:
      application: "${{ github.workflow }}"
      environment: "${{ matrix.target }}"
      action: "${{ matrix.action }}"
      component: "${{ matrix.component }}"     # If your strategy workflow also outputs "matrix.component"
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_ID: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}

  destroy-development:
    if: inputs.action == 'destroy'
    uses: ./.github/workflows/reusable_terraform_components_plan_apply.yml
    with:
      application: "${{ github.workflow }}"
      environment: "development"
      action: "plan_apply"
      plan_apply_tfargs: "-destroy"
      component: "${{ inputs.component }}"  # Targets a specific component for the destroy operation; defaults to 'root' if not specified.
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_ID: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}
