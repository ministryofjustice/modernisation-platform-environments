---
name: integration-hub-file-transfer
on:
  push:
    branches:
      - main
    paths:
      - 'terraform/environments/integration-hub-file-transfer/**'
      - '.github/workflows/integration-hub-file-transfer.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'terraform/environments/integration-hub-file-transfer/**'
      - '.github/workflows/integration-hub-file-transfer.yml'

  workflow_dispatch:
    inputs:
      action:
        description: 'Set either [deploy|destroy].'
        default: 'deploy'
        required: true
        type: string
        options:
          - deploy
          - destroy
      component:
        description: "Optional: Target a specific component for destroy. Defaults to 'root' to destroy the root or <application> folder."
        required: false
        default: "root"
        type: string

permissions:
  id-token: write  # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

jobs:
  python-tests:
    name: Python Lambda tests
    if: inputs.action != 'destroy'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            terraform/environments/integration-hub-file-transfer/lambda/*/requirements.txt
            terraform/environments/integration-hub-file-transfer/lambda/file-mover/test-requirements.txt

      - name: Install Lambda dependencies
        working-directory: terraform/environments/integration-hub-file-transfer
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r lambda/file-received-adapter/requirements.txt \
            -r lambda/file-scan-result-recorded-adapter/requirements.txt \
            -r lambda/file-mover/requirements.txt \
            -r lambda/file-mover/test-requirements.txt

      - name: Test file received adapter
        working-directory: terraform/environments/integration-hub-file-transfer/lambda/file-received-adapter
        run: python -m unittest -v

      - name: Test file scan result recorded adapter
        working-directory: terraform/environments/integration-hub-file-transfer/lambda/file-scan-result-recorded-adapter
        run: python -m unittest -v

      - name: Test file movers
        working-directory: terraform/environments/integration-hub-file-transfer/lambda/file-mover
        run: |
          python -m unittest -v
          python -m compileall -q stage_lambda.py route_lambda.py mft_file_mover

  strategy:
    uses: ./.github/workflows/reusable_terraform_components_strategy.yml
    if: inputs.action != 'destroy'
    with:
      application: "${{ github.workflow }}"

  terraform:
    needs: [strategy, python-tests]
    if: inputs.action != 'destroy' && join(fromJson(needs.strategy.outputs.matrix).include) != ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.strategy.outputs.matrix) }}
    uses: ./.github/workflows/reusable_terraform_components_plan_apply.yml
    with:
      application: "${{ github.workflow }}"
      environment: "${{ matrix.target }}"
      action: "${{ matrix.action }}"
      component: "${{ matrix.component }}"     # If your strategy workflow also outputs "matrix.component"
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_ID: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}

  destroy-development:
    if: inputs.action == 'destroy'
    uses: ./.github/workflows/reusable_terraform_components_plan_apply.yml
    with:
      application: "${{ github.workflow }}"
      environment: "development"
      action: "plan_apply"
      plan_apply_tfargs: "-destroy"
      component: "${{ inputs.component }}"  # Targets a specific component for the destroy operation; defaults to 'root' if not specified.
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_ID: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}
