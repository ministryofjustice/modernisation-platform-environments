---
name: integration-hub-file-transfer
'on':
  push:
    branches:
      - main
    paths:
      - 'terraform/environments/integration-hub-file-transfer/**'
      - '.github/workflows/integration-hub-file-transfer.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'terraform/environments/integration-hub-file-transfer/**'
      - '.github/workflows/integration-hub-file-transfer.yml'

  workflow_dispatch:
    inputs:
      action:
        description: 'Set either [deploy|destroy].'
        default: 'deploy'
        required: true
        type: choice
        options:
          - deploy
          - destroy
      component:
        description: "Optional: Target a specific component for destroy. Defaults to 'root' to destroy the root or <application> folder."
        required: false
        default: "root"
        type: string

permissions:
  contents: read  # This is required for actions/checkout

# Hold the shared environment through both deployment and verification.
concurrency:
  group: integration-hub-file-transfer-deploy-and-test
  cancel-in-progress: false

jobs:
  strategy:
    uses: ./.github/workflows/reusable_terraform_components_strategy.yml
    if: inputs.action != 'destroy'
    with:
      application: "${{ github.workflow }}"

  test-candidate:
    name: Identify a test deployment
    needs: strategy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      run-tests: ${{ steps.candidate.outputs.run-tests }}
    steps:
      - name: Check for a test plan/apply target
        id: candidate
        shell: bash
        env:
          TARGET_MATRIX: ${{ needs.strategy.outputs.matrix }}
        run: |
          set -euo pipefail
          run_tests=$(jq -er '
            if (.include | type) != "array" then
              error("Expected a Terraform component matrix")
            else
              any(.include[]; .target == "test" and .action == "plan_apply") | tostring
            end
          ' <<< "$TARGET_MATRIX")
          echo "run-tests=$run_tests" >> "$GITHUB_OUTPUT"
          if [[ "$run_tests" == "false" ]]; then
            echo "::notice::No test plan/apply target; live file-transfer tests are not applicable."
          fi

  terraform:
    needs: strategy
    if: inputs.action != 'destroy' && join(fromJson(needs.strategy.outputs.matrix).include) != ''
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.strategy.outputs.matrix) }}
    uses: ./.github/workflows/reusable_terraform_components_plan_apply.yml
    with:
      application: "${{ github.workflow }}"
      environment: "${{ matrix.target }}"
      action: "${{ matrix.action }}"
      component: "${{ matrix.component }}"     # If your strategy workflow also outputs "matrix.component"
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_ID: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}

  integration-tests:
    name: File-transfer integration tests
    needs: [test-candidate, terraform]
    if: >-
      needs.terraform.result == 'success' &&
      needs.test-candidate.outputs.run-tests == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      id-token: write
    uses: ministryofjustice/integration-hub/.github/workflows/file-transfer-tests.yml@d8f56f8a70348a5ece2cbb767f65cb5f929686c7
    with:
      infrastructure-sha: ${{ github.sha }}
      harness-ref: d8f56f8a70348a5ece2cbb767f65cb5f929686c7
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_ID: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}

  notify-failure:
    needs: [strategy, terraform]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Configure AWS credentials for PagerDuty key retrieval
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}:role/github-actions-read-secrets
          aws-region: eu-west-2

      - name: Report Terraform failure to PagerDuty
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          COMMIT: ${{ github.sha }}
          TARGET_MATRIX: ${{ needs.strategy.outputs.matrix || '{"include":[]}' }}
        run: |
          set -euo pipefail

          if ! PAGERDUTY_ROUTING_KEY=$(aws secretsmanager get-secret-value \
            --secret-id pagerduty_integration_keys \
            --query SecretString --output json |
            jq -er 'fromjson | .integration_hub_deployment_failure | select(type == "string" and length > 0)' 2>/dev/null); then
            echo "::error::Unable to read the PagerDuty deployment-failure routing key from AWS Secrets Manager."
            exit 1
          fi

          masked_key="${PAGERDUTY_ROUTING_KEY//%/%25}"
          masked_key="${masked_key//$'\r'/%0D}"
          masked_key="${masked_key//$'\n'/%0A}"
          printf '::add-mask::%s\n' "$masked_key"
          export PAGERDUTY_ROUTING_KEY

          jq -n \
            --arg repository "$REPOSITORY" \
            --arg workflow "$WORKFLOW" \
            --arg run "$RUN_ID" \
            --arg attempt "$RUN_ATTEMPT" \
            --arg actor "$ACTOR" \
            --arg triggering_actor "$TRIGGERING_ACTOR" \
            --arg commit "$COMMIT" \
            --arg url "$RUN_URL" \
            --argjson matrix "$TARGET_MATRIX" \
            '{
              routing_key: env.PAGERDUTY_ROUTING_KEY,
              event_action: "trigger",
              dedup_key: ($repository + ":" + $workflow + ":" + $run),
              client: "GitHub Actions",
              client_url: $url,
              payload: {
                summary: ($workflow + " Terraform run failed on main"),
                source: $repository,
                severity: "error",
                custom_details: {
                  actor: $actor,
                  triggering_actor: $triggering_actor,
                  commit: $commit,
                  run_attempt: $attempt,
                  planned_targets: $matrix.include
                }
              },
              links: [{href: $url, text: "View workflow run"}]
            }' |
            curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 30 --retry 3 --retry-max-time 90 \
              --request POST https://events.pagerduty.com/v2/enqueue \
              --header 'Content-Type: application/json' \
              --data-binary @- |
            jq -e '.status == "success"' > /dev/null

  destroy-development:
    if: inputs.action == 'destroy'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/reusable_terraform_components_plan_apply.yml
    with:
      application: "${{ github.workflow }}"
      environment: "development"
      action: "plan_apply"
      plan_apply_tfargs: "-destroy"
      component: "${{ inputs.component }}"  # Targets a specific component for the destroy operation; defaults to 'root' if not specified.
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_ID: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}
