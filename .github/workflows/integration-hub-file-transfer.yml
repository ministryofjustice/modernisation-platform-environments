---
name: integration-hub-file-transfer
on:
  push:
    branches:
      - main
    paths:
      - 'terraform/environments/integration-hub-file-transfer/**'
      - '.github/workflows/integration-hub-file-transfer.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'terraform/environments/integration-hub-file-transfer/**'
      - '.github/workflows/integration-hub-file-transfer.yml'

  workflow_dispatch:
    inputs:
      action:
        description: 'Set either [deploy|destroy].'
        default: 'deploy'
        required: true
        type: string
        options:
          - deploy
          - destroy
      component:
        description: "Optional: Target a specific component for destroy. Defaults to 'root' to destroy the root or <application> folder."
        required: false
        default: "root"
        type: string

permissions:
  id-token: write  # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

jobs:
  validate-configuration-schemas:
    name: 📐 Validate ${{ matrix.schema }} (${{ matrix.environment }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        schema:
          - legacy-transfer-identities
          - transfer-web-app-groups
        environment:
          - development
          - test
          - preproduction
          - production
    defaults:
      run:
        working-directory: terraform/environments/integration-hub-file-transfer
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set Up UV
        id: setup_uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"

      - name: Install Dependencies
        id: install_dependencies
        run: |
          uv sync

      - name: Validate Schema (${{ matrix.schema }} / ${{ matrix.environment }})
        id: validate_schema
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          SCHEMA: ${{ matrix.schema }}
        run: |
          uv run check-jsonschema \
            --schemafile "schemas/${SCHEMA}.json" \
            "configuration/${ENVIRONMENT}/${SCHEMA}.json"

  strategy:
    needs: [validate-configuration-schemas]
    uses: ./.github/workflows/reusable_terraform_components_strategy.yml
    if: inputs.action != 'destroy'
    with:
      application: "${{ github.workflow }}"

  terraform:
    needs: strategy
    if: inputs.action != 'destroy' && join(fromJson(needs.strategy.outputs.matrix).include) != ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.strategy.outputs.matrix) }}
    uses: ./.github/workflows/reusable_terraform_components_plan_apply.yml
    with:
      application: "${{ github.workflow }}"
      environment: "${{ matrix.target }}"
      action: "${{ matrix.action }}"
      component: "${{ matrix.component }}"     # If your strategy workflow also outputs "matrix.component"
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_ID: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}

  destroy-development:
    if: inputs.action == 'destroy'
    uses: ./.github/workflows/reusable_terraform_components_plan_apply.yml
    with:
      application: "${{ github.workflow }}"
      environment: "development"
      action: "plan_apply"
      plan_apply_tfargs: "-destroy"
      component: "${{ inputs.component }}"  # Targets a specific component for the destroy operation; defaults to 'root' if not specified.
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_ID: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}
