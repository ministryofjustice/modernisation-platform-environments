---
name: cloud-platform
"on":
  push:
    branches:
      - main
    paths:
      - 'terraform/environments/cloud-platform/**'
      - '.github/workflows/cloud-platform.yml'
      - '.github/workflows/cloud-platform-reusable.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'terraform/environments/cloud-platform/**'
      - '.github/workflows/cloud-platform.yml'
      - '.github/workflows/cloud-platform-reusable.yml'
      - '.github/workflows/reusable_terraform_components_plan_apply.yml'

permissions:
  contents: read  # This is required for actions/checkout

jobs:

  # Fetched once here and passed down to avoid hitting rate limits from repeated calls in the reusable workflows below
  fetch-secrets:
    permissions:
      id-token: write
    uses: ministryofjustice/modernisation-platform-github-actions/.github/workflows/aws-secrets-management.yml@b70a7dc60395eb3df40beacbf221fcee459b4c01 # v6.2.8
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_NUMBER: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}

  development-root-terraform:
    needs: fetch-secrets
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable_terraform_components_plan_apply.yml
    with:
      application: cloud-platform
      environment: development
      action: "plan_apply"
      component: "root"
      secrets_prefetched: true
      # Root manages the centralised AMG workspace and its Grafana-internal
      # objects (teams, data sources, permissions), so the Grafana provider needs
      # a short-lived service account token. No-op on workspaces without AMG.
      # Matches the root-terraform job in cloud-platform-reusable.yml.
      mint_grafana_token: true
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_ID: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}
      ENVIRONMENT_MANAGEMENT: ${{ needs.fetch-secrets.outputs.environment_management }}
      GITHUB_CI_USER_ENVIRONMENTS_REPO_PAT: ${{ needs.fetch-secrets.outputs.github_ci_user_environments_repo_pat }}

  development-network-terraform:
    needs: fetch-secrets
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable_terraform_components_plan_apply.yml
    with:
      application: cloud-platform
      environment: development
      action: "plan_apply"
      component: "network"
      secrets_prefetched: true
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_ID: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}
      ENVIRONMENT_MANAGEMENT: ${{ needs.fetch-secrets.outputs.environment_management }}
      GITHUB_CI_USER_ENVIRONMENTS_REPO_PAT: ${{ needs.fetch-secrets.outputs.github_ci_user_environments_repo_pat }}

  terraform-pr:
    needs: fetch-secrets
    permissions:
      contents: read
      id-token: write
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - application: cloud-platform
            environment: preproduction
            action: "plan"
          - application: cloud-platform
            environment: nonlive
            action: "plan"
          - application: cloud-platform
            environment: live
            action: "plan"
    uses: ./.github/workflows/cloud-platform-reusable.yml
    with:
      application: "${{ matrix.application }}"
      environment: "${{ matrix.environment }}"
      action: "${{ matrix.action }}"
      secrets_prefetched: true
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_ID: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}
      ENVIRONMENT_MANAGEMENT: ${{ needs.fetch-secrets.outputs.environment_management }}
      GITHUB_CI_USER_ENVIRONMENTS_REPO_PAT: ${{ needs.fetch-secrets.outputs.github_ci_user_environments_repo_pat }}

  terraform-main:
    needs: fetch-secrets
    permissions:
      contents: read
      id-token: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - application: cloud-platform
            environment: preproduction
            action: "plan_apply"
          - application: cloud-platform
            environment: nonlive
            action: "plan_apply"
          - application: cloud-platform
            environment: live
            action: "plan_apply"
    uses: ./.github/workflows/cloud-platform-reusable.yml
    with:
      application: "${{ matrix.application }}"
      environment: "${{ matrix.environment }}"
      action: "${{ matrix.action }}"
      secrets_prefetched: true
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_ID: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}
      ENVIRONMENT_MANAGEMENT: ${{ needs.fetch-secrets.outputs.environment_management }}
      GITHUB_CI_USER_ENVIRONMENTS_REPO_PAT: ${{ needs.fetch-secrets.outputs.github_ci_user_environments_repo_pat }}
