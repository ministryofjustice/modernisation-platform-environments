---
name: container-platform
on:
  push:
    branches:
      - main
    paths:
      - 'terraform/environments/cloud-platform/**'
      - 'terraform/environments/cloud-platform/accounts.json'
      - '.github/workflows/container-platform.yml'
      - '.github/workflows/cloud-platform-reusable.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'terraform/environments/cloud-platform/**'
      - 'terraform/environments/cloud-platform/accounts.json'
      - '.github/workflows/container-platform.yml'
      - '.github/workflows/cloud-platform-reusable.yml'
      - '.github/workflows/reusable_terraform_components_plan_apply.yml'

permissions:
  id-token: write  # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: set-matrix
        run: |
          json="["
          while IFS= read -r account; do
            env="${account##*-}"
            json+="{\"environment\":\"$env\",\"account_name\":\"$account\"},"
          done < <(jq -r '.accounts[]' terraform/environments/cloud-platform/accounts.json)
          echo "matrix=${json%,}]" >> $GITHUB_OUTPUT

  # Fetched once here and passed down to avoid hitting rate limits from repeated calls in the reusable workflows below
  fetch-secrets:
    uses: ministryofjustice/modernisation-platform-github-actions/.github/workflows/aws-secrets-management.yml@e49ac27b104b38bac12fc1e3257a13be6289a59c # v6.2.2
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_NUMBER: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}

  terraform-pr:
    needs: [setup, fetch-secrets]
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    uses: ./.github/workflows/cloud-platform-reusable.yml
    with:
      application: "cloud-platform"
      environment: "${{ matrix.environment }}"
      action: "plan"
      account_name: "${{ matrix.account_name }}"
      secrets_prefetched: true
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_ID: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}
      ENVIRONMENT_MANAGEMENT: ${{ needs.fetch-secrets.outputs.environment_management }}
      GITHUB_CI_USER_ENVIRONMENTS_REPO_PAT: ${{ needs.fetch-secrets.outputs.github_ci_user_environments_repo_pat }}

  terraform-main:
    needs: [setup, fetch-secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    uses: ./.github/workflows/cloud-platform-reusable.yml
    with:
      application: "cloud-platform"
      environment: "${{ matrix.environment }}"
      action: "plan_apply"
      account_name: "${{ matrix.account_name }}"
      secrets_prefetched: true
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_ID: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}
      ENVIRONMENT_MANAGEMENT: ${{ needs.fetch-secrets.outputs.environment_management }}
      GITHUB_CI_USER_ENVIRONMENTS_REPO_PAT: ${{ needs.fetch-secrets.outputs.github_ci_user_environments_repo_pat }}