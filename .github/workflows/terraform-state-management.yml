---
name: Terraform State Management

"on":
  workflow_dispatch:
    inputs:
      operation:
        description: "State operation to perform"
        required: true
        type: choice
        options:
          - unlock
          - import
          - remove
      application:
        description: "Application name (e.g. apex)"
        required: true
        type: string
      workspace:
        description: "Environment workspace"
        required: true
        type: choice
        options:
          - development
          - test
          - preproduction
          - production
      lock_id:
        description: "Lock ID (required for unlock operation)"
        required: false
        type: string
      resource_addresses:
        description: "Resource addresses (comma-separated, required for import/remove operations)"
        required: false
        type: string
      resource_ids:
        description: "Resource IDs for import (comma-separated, must match resource_addresses order)"
        required: false
        type: string
      branch_name:
        description: "Feature branch to checkout (Required for import operation)"
        required: false
        type: string
        default: "main"
      component:
        type: string
        required: false
        default: "root"
        description: "Component (Optional: subfolder in 'terraform/environments/<application>' if present)"

permissions:
  contents: read
  actions: read

jobs:
  request_operation:
    runs-on: ubuntu-latest
    env:
      OPERATION: ${{ github.event.inputs.operation }}
      APPLICATION: ${{ github.event.inputs.application }}
      WORKSPACE: ${{ github.event.inputs.workspace }}
      LOCK_ID: ${{ github.event.inputs.lock_id }}
      RESOURCE_ADDRESSES: ${{ github.event.inputs.resource_addresses }}
      RESOURCE_IDS: ${{ github.event.inputs.resource_ids }}
      BRANCH_NAME: ${{ github.event.inputs.branch_name }}
      COMPONENT: ${{ github.event.inputs.component }}
    outputs:
      operation_summary: ${{ steps.create_summary.outputs.summary }}
    steps:
      - name: Validate Inputs
        run: |
          if [[ "${OPERATION}" == "unlock" && -z "${LOCK_ID}" ]]; then
            echo "Error: lock_id is required for unlock operation"
            exit 1
          fi

          if [[ "${OPERATION}" != "unlock" && -z "${RESOURCE_ADDRESSES}" ]]; then
            echo "Error: resource_addresses is required for import/remove operations"
            exit 1
          fi

          if [[ "${OPERATION}" == "import" && -z "${RESOURCE_IDS}" ]]; then
            echo "Error: resource_ids is required for import operation"
            exit 1
          fi

      - name: Show Operation Details
        run: |
          echo "Requested operation: ${OPERATION}"
          echo "Application: ${APPLICATION}"
          echo "Workspace: ${WORKSPACE}"
          echo "Target folder: terraform/environments/${APPLICATION}"
          echo "Target workspace: ${APPLICATION}-${WORKSPACE}"

          if [[ "${COMPONENT}" != "root" ]]; then
            echo "Component: ${COMPONENT}"
          fi

          if [[ "${BRANCH_NAME}" != "main" ]]; then
            echo "Branch: ${BRANCH_NAME}"
          fi

          if [[ "${OPERATION}" == "unlock" ]]; then
            echo "Lock ID: ${LOCK_ID}"
          else
            echo "Resource Addresses (comma-separated):"
            printf '%s\n' "${RESOURCE_ADDRESSES}"
            if [[ "${OPERATION}" == "import" ]]; then
              echo "Resource IDs (comma-separated):"
              printf '%s\n' "${RESOURCE_IDS}"
            fi
          fi

      - name: Create Operation Summary
        id: create_summary
        run: |
          # Create markdown formatted summary
          {
          echo "# Terraform State Operation Request"
          echo ""
          echo "**Operation:** ${OPERATION}"
          echo "**Target workspace:** ${APPLICATION}-${WORKSPACE}"

          SUMMARY="## Operation Details\n"
          SUMMARY+="- **Operation:** ${OPERATION}\n"
          SUMMARY+="- **Application:** ${APPLICATION}\n"
          SUMMARY+="- **Workspace:** ${WORKSPACE}\n"

          if [[ "${COMPONENT}" != "root" ]]; then
            echo "**Component:** ${COMPONENT}"
            SUMMARY+="- **Component:** ${COMPONENT}\n"
          fi

          if [[ "${BRANCH_NAME}" != "main" ]]; then
            echo "**Branch:** ${BRANCH_NAME}"
            SUMMARY+="- **Branch:** ${BRANCH_NAME}\n"
          fi

          if [[ "${OPERATION}" == "unlock" ]]; then
              echo "**Lock ID:** ${LOCK_ID}"
              SUMMARY+="- **Lock ID:** ${LOCK_ID}\n"
          else
              # Convert comma-separated values to newlines for display
              ADDRESSES_DISPLAY=$(printf '%s' "${RESOURCE_ADDRESSES}" | tr ',' '\n')

              echo "**Resource Addresses:**"
              echo '```'
              echo "$ADDRESSES_DISPLAY"
              echo '```'

              # Format for output to next job (keep as comma-separated)
              SUMMARY+="- **Resources:** ${RESOURCE_ADDRESSES}\n"

              if [[ "${OPERATION}" == "import" ]]; then
                # Convert comma-separated values to newlines for display
                IDS_DISPLAY=$(printf '%s' "${RESOURCE_IDS}" | tr ',' '\n')

                echo "**Resource IDs:**"
                echo '```'
                echo "$IDS_DISPLAY"
                echo '```'
              fi
          fi

          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "summary<<EOF"
            printf '%b\n' "$SUMMARY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  fetch-secrets:
    permissions:
      id-token: write
    uses: ministryofjustice/modernisation-platform-github-actions/.github/workflows/aws-secrets-management.yml@6a78b87ea8e63646ec10701857c70cb2487738ab # v6.2.7
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_NUMBER: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}

  approve_operation:
    needs: [request_operation, fetch-secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      APPLICATION: ${{ github.event.inputs.application }}
      WORKSPACE: ${{ github.event.inputs.workspace }}
      LOCK_ID: ${{ github.event.inputs.lock_id }}
      RESOURCE_ADDRESSES: ${{ github.event.inputs.resource_addresses }}
      RESOURCE_IDS: ${{ github.event.inputs.resource_ids }}
      COMPONENT: ${{ github.event.inputs.component }}
      TF_DIRECTORY: ${{ github.event.inputs.component != 'root' && format('terraform/environments/{0}/{1}', github.event.inputs.application, github.event.inputs.component) || format('terraform/environments/{0}', github.event.inputs.application) }}
    environment: ${{ github.event.inputs.application }}-${{ github.event.inputs.workspace }}
    steps:
      - name: Display Operation Details
        env:
          OPERATION_SUMMARY: ${{ needs.request_operation.outputs.operation_summary }}
        run: |
          printf '%b\n' "${OPERATION_SUMMARY}" >> "$GITHUB_STEP_SUMMARY"

          # Also output to console for logs
          printf '%b\n' "${OPERATION_SUMMARY}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.branch_name }}
          persist-credentials: false

      - name: Decrypt Secrets
        uses: ministryofjustice/modernisation-platform-github-actions/decrypt-secrets@b70a7dc60395eb3df40beacbf221fcee459b4c01 # v6.2.8
        with:
          environment_management: ${{ needs.fetch-secrets.outputs.environment_management }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1"

      - name: Get AWS Account Number
        id: get-account
        run: |
          ACCOUNT_NAME="${APPLICATION}-${WORKSPACE}"
          ACCOUNT_NUMBER=$(jq -r -e --arg account_name "${ACCOUNT_NAME}" '.account_ids[$account_name]' <<< "$ENVIRONMENT_MANAGEMENT")
          echo "::add-mask::$ACCOUNT_NUMBER"
          echo "ACCOUNT_NUMBER=${ACCOUNT_NUMBER}" >> "$GITHUB_ENV"
          echo "account_number=${ACCOUNT_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: "arn:aws:iam::${{ steps.get-account.outputs.account_number }}:role/github-actions-apply"
          role-session-name: githubactionsrolesession
          aws-region: "eu-west-2"

      - name: Terraform Init
        working-directory: "${{ inputs.component != 'root' && format('terraform/environments/{0}/{1}', inputs.application, inputs.component) || format('terraform/environments/{0}', inputs.application) }}"
        run: terraform init

      - name: Select Workspace
        working-directory: "${{ inputs.component != 'root' && format('terraform/environments/{0}/{1}', inputs.application, inputs.component) || format('terraform/environments/{0}', inputs.application) }}"
        run: terraform workspace select "${APPLICATION}-${WORKSPACE}"

      - name: Perform Unlock Operation
        if: github.event.inputs.operation == 'unlock'
        working-directory: "${{ inputs.component != 'root' && format('terraform/environments/{0}/{1}', inputs.application, inputs.component) || format('terraform/environments/{0}', inputs.application) }}"
        run: terraform force-unlock -force "${LOCK_ID}"

      - name: Write Resource Addresses to File
        if: github.event.inputs.operation != 'unlock'
        run: |
          mkdir -p temp
          # Convert comma-separated values to newlines
          printf '%s' "${RESOURCE_ADDRESSES}" | tr ',' '\n' > temp/resource_addresses.txt

      - name: Write Resource IDs to File
        if: github.event.inputs.operation == 'import'
        run: |
          # Convert comma-separated values to newlines
          printf '%s' "${RESOURCE_IDS}" | tr ',' '\n' > temp/resource_ids.txt

      - name: Execute Import Script
        if: github.event.inputs.operation == 'import'
        run: |
          scripts/terraform-import.sh \
            "${TF_DIRECTORY}" \
            temp/resource_addresses.txt \
            temp/resource_ids.txt

      - name: Execute Remove Script
        if: github.event.inputs.operation == 'remove'
        run: |
          scripts/terraform-remove.sh \
            "${TF_DIRECTORY}" \
            temp/resource_addresses.txt
