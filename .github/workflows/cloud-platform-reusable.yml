---
name: cloud-platform-reusable
on:
  workflow_call:
    inputs:
      application:
        type: string
        required: true
        description: "Name of the application, e.g. nomis"
      environment:
        type: string
        required: true
        description: "Name of the environment, e.g. development"
      action:
        type: string
        required: false
        description: "Set to plan or plan_apply"
        default: plan
      account_name:
        type: string
        required: false
        description: "Optional: account name override for ACCOUNT_NAME env var."
      secrets_prefetched:
        type: boolean
        required: false
        default: false
        description: "Optional: set to true when the caller already fetched secrets and is passing them in via ENVIRONMENT_MANAGEMENT/GITHUB_CI_USER_ENVIRONMENTS_REPO_PAT secrets."
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_ID:
        required: true
      PASSPHRASE:
        required: true
      ENVIRONMENT_MANAGEMENT:
        required: false
        description: "Optional: pre-fetched environment_management secret, passed down to skip re-fetching in each component's plan/apply workflow."
      GITHUB_CI_USER_ENVIRONMENTS_REPO_PAT:
        required: false
        description: "Optional: pre-fetched github_ci_user_environments_repo_pat secret, passed down to skip re-fetching in each component's plan/apply workflow."

permissions:
  id-token: write  # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

jobs:

  root-terraform:
    uses: ./.github/workflows/reusable_terraform_components_plan_apply.yml
    with:
      application: ${{ inputs.application }}
      environment: ${{ inputs.environment }}
      action: ${{ inputs.action }}
      component: "root"
      account_name: ${{ inputs.account_name }}
      secrets_prefetched: ${{ inputs.secrets_prefetched }}
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_ID: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}
      ENVIRONMENT_MANAGEMENT: ${{ secrets.ENVIRONMENT_MANAGEMENT }}
      GITHUB_CI_USER_ENVIRONMENTS_REPO_PAT: ${{ secrets.GITHUB_CI_USER_ENVIRONMENTS_REPO_PAT }}

  network-terraform:
    needs: root-terraform
    uses: ./.github/workflows/reusable_terraform_components_plan_apply.yml
    with:
      application: ${{ inputs.application }}
      environment: ${{ inputs.environment }}
      action: ${{ inputs.action }}
      component: "network"
      account_name: ${{ inputs.account_name }}
      secrets_prefetched: ${{ inputs.secrets_prefetched }}
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_ID: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}
      ENVIRONMENT_MANAGEMENT: ${{ secrets.ENVIRONMENT_MANAGEMENT }}
      GITHUB_CI_USER_ENVIRONMENTS_REPO_PAT: ${{ secrets.GITHUB_CI_USER_ENVIRONMENTS_REPO_PAT }}

  cluster-terraform:
    needs: network-terraform
    uses: ./.github/workflows/reusable_terraform_components_plan_apply.yml
    with:
      application: ${{ inputs.application }}
      environment: ${{ inputs.environment }}
      action: ${{ inputs.action }}
      plan_apply_tfargs: ${{ format('-var=created_by={0}/{1}/actions/runs/{2}/', github.server_url, github.repository, github.run_id) }}
      component: "cluster"
      account_name: ${{ inputs.account_name }}
      secrets_prefetched: ${{ inputs.secrets_prefetched }}
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_ID: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}
      ENVIRONMENT_MANAGEMENT: ${{ secrets.ENVIRONMENT_MANAGEMENT }}
      GITHUB_CI_USER_ENVIRONMENTS_REPO_PAT: ${{ secrets.GITHUB_CI_USER_ENVIRONMENTS_REPO_PAT }}

  cluster-base-terraform:
    needs: cluster-terraform
    uses: ./.github/workflows/reusable_terraform_components_plan_apply.yml
    with:
      application: ${{ inputs.application }}
      environment: ${{ inputs.environment }}
      action: ${{ inputs.action }}
      component: "cluster-base"
      account_name: ${{ inputs.account_name }}
      secrets_prefetched: ${{ inputs.secrets_prefetched }}
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_ID: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}
      ENVIRONMENT_MANAGEMENT: ${{ secrets.ENVIRONMENT_MANAGEMENT }}
      GITHUB_CI_USER_ENVIRONMENTS_REPO_PAT: ${{ secrets.GITHUB_CI_USER_ENVIRONMENTS_REPO_PAT }}

  cluster-core-terraform:
    needs: cluster-base-terraform
    uses: ./.github/workflows/reusable_terraform_components_plan_apply.yml
    with:
      application: ${{ inputs.application }}
      environment: ${{ inputs.environment }}
      action: ${{ inputs.action }}
      component: "cluster-core"
      account_name: ${{ inputs.account_name }}
      secrets_prefetched: ${{ inputs.secrets_prefetched }}
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_ID: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}
      ENVIRONMENT_MANAGEMENT: ${{ secrets.ENVIRONMENT_MANAGEMENT }}
      GITHUB_CI_USER_ENVIRONMENTS_REPO_PAT: ${{ secrets.GITHUB_CI_USER_ENVIRONMENTS_REPO_PAT }}

  cluster-components-terraform:
    needs: cluster-core-terraform
    uses: ./.github/workflows/reusable_terraform_components_plan_apply.yml
    with:
      application: ${{ inputs.application }}
      environment: ${{ inputs.environment }}
      action: ${{ inputs.action }}
      component: "cluster-components"
      account_name: ${{ inputs.account_name }}
      secrets_prefetched: ${{ inputs.secrets_prefetched }}
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_ID: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_ID }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}
      ENVIRONMENT_MANAGEMENT: ${{ secrets.ENVIRONMENT_MANAGEMENT }}
      GITHUB_CI_USER_ENVIRONMENTS_REPO_PAT: ${{ secrets.GITHUB_CI_USER_ENVIRONMENTS_REPO_PAT }}
