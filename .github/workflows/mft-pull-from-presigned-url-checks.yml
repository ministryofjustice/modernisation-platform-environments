name: MFT pull-from-presigned-url checks

on:
  pull_request:
    paths:
      - 'terraform/environments/integration-hub-file-transfer/pull-from-presigned-url/**'
      - 'terraform/environments/integration-hub-file-transfer/modules/authenticated-pickup-configuration/**'
      - 'terraform/environments/integration-hub-file-transfer/modules/transfer-web-app-identity-configuration/**'
      - '.github/workflows/mft-pull-from-presigned-url-checks.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/environments/integration-hub-file-transfer/pull-from-presigned-url/**'
      - 'terraform/environments/integration-hub-file-transfer/modules/authenticated-pickup-configuration/**'
      - 'terraform/environments/integration-hub-file-transfer/modules/transfer-web-app-identity-configuration/**'
      - '.github/workflows/mft-pull-from-presigned-url-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test authenticated Slack pickup notifications
        env:
          PYTHONPATH: terraform/environments/integration-hub-file-transfer/pull-from-presigned-url/lambda/notifier
        run: python3 -m unittest discover -s terraform/environments/integration-hub-file-transfer/pull-from-presigned-url/lambda/notifier/tests -v
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1"
          terraform_wrapper: false
      - name: Validate notification component without AWS credentials or backend
        working-directory: terraform/environments/integration-hub-file-transfer/pull-from-presigned-url
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color
