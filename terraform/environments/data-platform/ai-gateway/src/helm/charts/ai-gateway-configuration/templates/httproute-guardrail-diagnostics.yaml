{{ if .Values.guardrailDiagnosticsEnabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-gateway-guardrail-diagnostics
  namespace: {{ .Release.Namespace }}
spec:
  hostnames:
    - {{ .Values.guardrailDiagnosticsHostname }}
  parentRefs:
    - name: ai-gateway
      sectionName: https-guardrail-diagnostics
  rules:
    - backendRefs:
        - name: litellm-guardrail-diagnostics
          port: 4000

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-gateway-guardrail-diagnostics-http-redirect
  namespace: {{ .Release.Namespace }}
spec:
  hostnames:
    - {{ .Values.guardrailDiagnosticsHostname }}
  parentRefs:
    - name: ai-gateway
      sectionName: http-guardrail-diagnostics
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 301
{{ end }}