organisations:
  ministryofjustice:
    alias: Ministry of Justice

teams:
  # litellm_team is currently missing the option to attach unified access groups, so for now we have to manually add them in the admin console.
  justice-data-platform:
    alias: Justice Data Platform
    organisation: ministryofjustice
    max_budget: 10000
    models: ["no-default-models"]
    unified_access_groups: ["generally-available-models"]
  justice-engineering-ai-enablement:
    alias: Justice Engineering AI Enablement
    organisation: ministryofjustice
    max_budget: 10000
    models: ["no-default-models"]
    unified_access_groups: ["generally-available-models"]
    model_aliases:
        - alias: "claude-haiku-4.5"
