environment:
  development:
    kubernetes_version: "1.36"
    bottlerocket_version: "1.64.0-ad9d4847"
    node_update_config:
      max_unavailable: 3
    addon_versions:
      aws_ebs_csi_driver: "v1.64.0-eksbuild.1"
      aws_efs_csi_driver: "v3.4.2-eksbuild.1"
      aws_guardduty_agent: "v1.16.0-eksbuild.2"
      aws_network_flow_monitoring_agent: "v1.1.6-eksbuild.1"
      eks_node_monitoring_agent: "v1.7.0-eksbuild.1"
      eks_pod_identity_agent: "v1.4.0-eksbuild.1"
    crd_versions:
      aws_load_balancer_controller: "v0.0.242"
      gateway_api: "v1.6.1"
      karpenter: "1.14.1"
      prometheus: "v0.93.1"
    helm_chart_versions:
      aws_cloudwatch_observability: "5.4.0"
      aws_load_balancer_controller: "v3.5.0"
      cert_manager: "1.21.1"
      cilium: "1.20.1"
      cluster_autoscaler: "9.59.0"
      coredns: "1.47.0"
      external_dns: "1.21.1"
      external_secrets: "2.9.0"
      fluent_bit: "0.2.0"
      karpenter: "1.14.1"
      keda: "2.20.2"
      kube_prometheus_stack: "88.5.4"
      kyverno: "3.9.0"
      metrics_server: "3.14.0"
    kyverno_policies:
      validation_action: "Audit"
      excluded_namespaces:
        - amazon-guardduty
        - amazon-network-flow-monitor
        - aws-cloudwatch-observability
        - cert-manager
        - cilium-secrets
        - cluster-autoscaler
        - external-dns
        - external-secrets
        - fluent-bit
        - karpenter
        - keda
        - kyverno
        - metrics-server
        - prometheus
        - shared-services
    route53_zones:
      - "development.data-platform.service.justice.gov.uk"
      - "development.ai-gateway.justice.gov.uk"
    shared_services_gateway_hostname: "*.development.data-platform.service.justice.gov.uk"
