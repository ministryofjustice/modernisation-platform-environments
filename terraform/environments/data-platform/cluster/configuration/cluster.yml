environment:
  development:
    kubernetes_version: "1.36"
    bottlerocket_version: "1.69.0-be6a1e85"
    node_update_config:
      max_unavailable: 3
    addon_versions:
      aws_ebs_csi_driver: "v1.68.0-eksbuild.1"
      aws_efs_csi_driver: "v3.6.0-eksbuild.1"
      aws_guardduty_agent: "v1.17.4-eksbuild.2"
      aws_network_flow_monitoring_agent: "v1.1.9-eksbuild.2"
      eks_node_monitoring_agent: "v1.7.7-eksbuild.1"
      eks_pod_identity_agent: "v1.4.0-eksbuild.1"
    crd_versions:
      aws_load_balancer_controller: "v0.0.252"
      gateway_api: "v1.6.3"
      karpenter: "1.15.2"
      prometheus: "v0.95.2"
    helm_chart_versions:
      aws_cloudwatch_observability: "5.4.0"
      aws_load_balancer_controller: "3.6.3"
      cert_manager: "v1.21.3"
      cilium: "1.20.5"
      cluster_autoscaler: "9.59.0"
      coredns: "1.50.8"
      external_dns: "1.23.0"
      external_secrets: "2.15.0"
      fluent_bit: "0.2.0"
      karpenter: "1.15.3"
      keda: "2.21.1"
      kube_prometheus_stack: "93.4.0"
      kyverno: "3.9.0"
      metrics_server: "3.14.0"
    kyverno_policies:
      validation_action: "Audit"
      excluded_namespaces:
        - amazon-guardduty
        - amazon-network-flow-monitor
        - aws-cloudwatch-observability
        - cert-manager
        - cilium-secrets
        - cluster-autoscaler
        - external-dns
        - external-secrets
        - fluent-bit
        - karpenter
        - keda
        - kyverno
        - metrics-server
        - prometheus
        - shared-services
    route53_zones:
      - "development.data-platform.service.justice.gov.uk"
      - "development.ai-gateway.justice.gov.uk"
    shared_services_gateway_hostname: "*.development.data-platform.service.justice.gov.uk"
