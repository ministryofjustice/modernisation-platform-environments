<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1040" viewBox="0 0 1780 1040"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M 0 0 L 9 3 L 0 6" fill="none" stroke="#63747d" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="50" y="58" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#24383c">People deployment | external trust and data boundaries</text><rect x="440" y="100" width="960" height="810" fill="#f6faf8" stroke="#217a6b" stroke-width="2" stroke-dasharray="10 6"/><text x="460" y="138" font-family="Arial, sans-serif" font-size="20" fill="#217a6b">People AWS account | one environment</text><text x="50" y="968" font-family="Arial, sans-serif" font-size="15" fill="#435157">Trust / access boundaries, not network routes. Desired configuration; reader onboarding depends on the access repository.</text><text x="50" y="1003" font-family="Arial, sans-serif" font-size="15" fill="#435157">Internal: landing and quarantine S3, Glue, Lake Formation, KMS, Secrets Manager, scanning and audit. No automatic public or whole-bucket reader access.</text><path d="M 275 218 L 500 218" stroke="#63747d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="387.5" y="209" text-anchor="middle" fill="#435157" font-family="Arial, sans-serif" font-size="12" paint-order="stroke" stroke="white" stroke-width="4">AssumeRole + ID</text><path d="M 275 458 L 500 458" stroke="#63747d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="387.5" y="449" text-anchor="middle" fill="#435157" font-family="Arial, sans-serif" font-size="12" paint-order="stroke" stroke="white" stroke-width="4">OIDC / STS</text><path d="M 275 728 L 500 728" stroke="#63747d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="387.5" y="719" text-anchor="middle" fill="#435157" font-family="Arial, sans-serif" font-size="12" paint-order="stroke" stroke="white" stro